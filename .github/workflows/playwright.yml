name: Playwright Tests

on:
  workflow_dispatch:
    inputs:
      suite_mode:
        description: 'Cakupan Pengujian Playwright E2E'
        required: true
        default: 'smoke'
        type: choice
        options:
          - smoke
          - full
  schedule:
    # Berjalan otomatis setiap hari pukul 02:00 WIB (19:00 UTC) untuk nightly regression check
    - cron: '0 19 * * *'
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    timeout-minutes: 45
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, iconv, intl, pdo, pdo_sqlite, sqlite3, gd, zip, fileinfo, bcmath
          tools: composer
          coverage: none

      - name: Get Composer Cache Directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Prepare Laravel environment
        run: |
          cp .env.example .env
          sed -i 's/MAIL_MAILER=smtp/MAIL_MAILER=log/g' .env || true
          php artisan key:generate
          mkdir -p database
          touch database/database.sqlite
          php artisan migrate --force
          php artisan db:seed --class=RolePermissionSeeder --force
          php artisan db:seed --class=WorkflowSeeder --force
          php artisan db:seed --class=KonfigurasiSeeder --force
          php artisan db:seed --class=MasterDataSeeder --force
          php artisan db:seed --class=PeriodeAnggaranSeeder --force
          php artisan db:seed --class=UserSeeder --force
          php artisan storage:link

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Node dependencies & Build Assets
        run: |
          npm ci
          npm run build

      - name: Cache Playwright Browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright OS dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run Playwright tests
        run: |
          SUITE_INPUT="${{ github.event.inputs.suite_mode }}"
          EVENT_NAME="${{ github.event_name }}"

          if [ "$EVENT_NAME" = "schedule" ] || [ "$SUITE_INPUT" = "full" ]; then
            echo "Menjalankan FULL SUITE E2E Playwright (17 specs)..."
            npx playwright test --workers=1
          else
            echo "Menjalankan SMOKE TEST E2E Playwright (Modul Kritis)..."
            npx playwright test e2e/01-auth-rbac.spec.ts e2e/02-dashboard-role.spec.ts e2e/12-aspirasi-regulasi.spec.ts --workers=1
          fi

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
