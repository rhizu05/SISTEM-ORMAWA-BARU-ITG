version: '3.8'

services:
  # 1. Aplikasi Laravel (PHP-FPM)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: skin_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - skin_storage:/var/www/storage
      - skin_cache:/var/www/bootstrap/cache
    environment:
      - APP_ENV=${APP_ENV:-production}
      - APP_KEY=${APP_KEY}
      - APP_DEBUG=${APP_DEBUG:-false}
      - APP_URL=${APP_URL:-http://localhost}
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-skin_itg}
      - DB_USERNAME=${DB_USERNAME:-skin_user}
      - DB_PASSWORD=${DB_PASSWORD:-secret}
      - QUEUE_CONNECTION=redis
      - CACHE_STORE=redis
      - SESSION_DRIVER=redis
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    networks:
      - skin_network
    depends_on:
      - db
      - redis

  # 2. Web Server (Nginx)
  webserver:
    image: nginx:alpine
    container_name: skin_webserver
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/var/www/public:ro
      - skin_storage:/var/www/storage:ro
    networks:
      - skin_network
    depends_on:
      - app

  # 3. Basis Data (MySQL 8.0)
  db:
    image: mysql:8.0
    container_name: skin_db
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-skin_itg}
      MYSQL_USER: ${DB_USERNAME:-skin_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-super_secret_root_password}
    volumes:
      - skin_dbdata:/var/lib/mysql
    networks:
      - skin_network

  # 4. Redis Cache & Queue Broker
  redis:
    image: redis:7-alpine
    container_name: skin_redis
    restart: unless-stopped
    volumes:
      - skin_redisdata:/data
    networks:
      - skin_network

  # 5. Background Queue Worker (Supervisor / Queue Runner)
  queue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: skin_queue
    restart: unless-stopped
    command: php /var/www/artisan queue:work redis --sleep=3 --tries=3 --timeout=120
    volumes:
      - skin_storage:/var/www/storage
    environment:
      - APP_ENV=${APP_ENV:-production}
      - APP_KEY=${APP_KEY}
      - DB_HOST=db
      - REDIS_HOST=redis
    networks:
      - skin_network
    depends_on:
      - app
      - redis
      - db

  # 6. Task Scheduler (Cron Runner)
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: skin_scheduler
    restart: unless-stopped
    command: sh -c "while true; do php /var/www/artisan schedule:run --verbose --no-interaction; sleep 60; done"
    volumes:
      - skin_storage:/var/www/storage
    environment:
      - APP_ENV=${APP_ENV:-production}
      - APP_KEY=${APP_KEY}
      - DB_HOST=db
      - REDIS_HOST=redis
    networks:
      - skin_network
    depends_on:
      - app
      - db

networks:
  skin_network:
    driver: bridge

volumes:
  skin_dbdata:
    driver: local
  skin_redisdata:
    driver: local
  skin_storage:
    driver: local
  skin_cache:
    driver: local
