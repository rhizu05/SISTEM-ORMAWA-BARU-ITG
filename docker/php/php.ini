[PHP]
memory_limit = 512M
max_execution_time = 180
upload_max_filesize = 30M
post_max_size = 35M
max_input_vars = 3000
date.timezone = Asia/Jakarta
expose_php = Off

error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /var/www/storage/logs/php_errors.log
